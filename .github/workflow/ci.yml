
name: Om Shoes Project Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f database.sql
          echo "Om Shoes project files checked successfully!"
